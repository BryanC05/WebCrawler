<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>꒰⍉ ꒱ WebCrawler ꒰⍉ ꒱</title>
<style>
  :root {
    --red: #ff2222;
    --blood: #c1001f;
    --gold: #ffd700;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #060608; }
  body { font-family: "Courier New", monospace; color: var(--cyan); }

  /* the real webpage, full viewport */
  #page {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    border: 0;
  }
  /* tint removed — the page stays fully visible */
  #tint[hidden] { display: none; }

  /* spider canvas overlay */
  #web {
    position: fixed; inset: 0; z-index: 3;
    width: 100%; height: 100%;
    pointer-events: none; /* let clicks pass to the page */
  }

  /* floating text labels that "bounce off" the page */
  .catch {
    position: fixed; z-index: 5; pointer-events: none;
    font-family: "Courier New", monospace;
    font-size: 12px; line-height: 1.3;
    background: rgba(2, 6, 10, 0.88);
    padding: 6px 10px;
    border: 1px solid;             /* color set inline (random) */
    border-radius: 3px;
    box-shadow: 0 0 10px currentColor;
    color: #dfe9ee;
    max-width: 280px;
    overflow-wrap: break-word;
    animation: pop 2.6s ease-out forwards;
  }
  .catch b { color: inherit; }
  .catch .url { opacity: .55; font-size: 10px; }
  @keyframes pop {
    0%   { transform: translate(-50%, -50%) scale(.4); opacity: 0; }
    12%  { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    20%  { transform: translate(-50%, -50%) scale(1); }
    70%  { opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1) translateY(-26px); opacity: 0; }
  }

  .hud {
    position: fixed; top: 16px; left: 20px; z-index: 10;
    font-size: 13px; letter-spacing: 1px;
    text-shadow: 0 0 8px var(--blood);
    user-select: none; pointer-events: none;
  }
  .hud .big {
    font-size: 22px; margin-bottom: 6px;
    text-shadow: 0 0 12px var(--red), 0 0 24px var(--gold);
    color: var(--gold);
  }
  .stats {
    position: fixed; top: 16px; right: 20px; z-index: 10;
    text-align: right; font-size: 13px; letter-spacing: 1px;
    text-shadow: 0 0 8px var(--cyan); pointer-events: none; user-select: none;
  }
  .stats span { color: var(--red); text-shadow: 0 0 8px var(--blood); }
  .urlbar {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 8px;
  }
  .urlbar input {
    font-family: "Courier New", monospace; font-size: 13px;
    background: rgba(10,10,12,.9); color: var(--gold);
    border: 1px solid var(--blood); box-shadow: 0 0 8px rgba(193,0,31,.5);
    padding: 7px 12px; width: 380px; outline: none;
  }
  .urlbar button {
    font-family: "Courier New", monospace; font-size: 13px;
    background: rgba(10,10,12,.9); color: var(--red);
    border: 1px solid var(--blood); box-shadow: 0 0 8px rgba(255,34,34,.5);
    padding: 7px 14px; cursor: pointer;
  }
  .vignette[hidden] { display: none; }
</style>
</head>
<body>

<iframe id="page" src="/proxy?url=__START_URL__"></iframe>
<div id="tint" hidden></div>
<canvas id="web"></canvas>
<div class="vignette" hidden></div>

<div class="hud">
  <div class="big">꒰⍉ ꒱ WebCrawler</div>
  <div id="status">waking up the spider…</div>
</div>

<div class="stats">
  legs caught: <span id="sCatches">0</span><br>
  pixels walked: <span id="sDist">0</span>
</div>

<div class="urlbar">
  <input id="urlInput" type="text" placeholder="https://…">
  <button id="goBtn">crawl ▸</button>
</div>

<script>
(() => {
  const frame = document.getElementById("page");
  const canvas = document.getElementById("web");
  const ctx = canvas.getContext("2d");
  const statusEl = document.getElementById("status");
  const sCatches = document.getElementById("sCatches");
  const sDist = document.getElementById("sDist");
  const urlInput = document.getElementById("urlInput");
  const goBtn = document.getElementById("goBtn");

  let W, H;
  const resize = () => { W = canvas.width = innerWidth; H = canvas.height = innerHeight; };
  addEventListener("resize", resize); resize();

  // ---------- floating text labels ("bouncing off" the page) ----------
  const PALETTE = ["#ff2222", "#c1001f", "#ffd700", "#b8860b", "#ff4444", "#e6c200"];
  const LABEL_REUSE_COUNT = 3;   // an element must be touched 3 times before its label pops again
  let catches = 0;

  function spawnLabel(x, y, text, sub, imgUrl) {
    const el = document.createElement("div");
    el.className = "catch";
    const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.borderColor = color;
    el.style.color = color;
    // image caught by a leg: show the picture itself
    if (imgUrl) {
      const img = document.createElement("img");
      img.src = imgUrl;
      img.style.display = "block";
      img.style.maxWidth = "200px";
      img.style.maxHeight = "150px";
      img.style.marginBottom = "4px";
      img.onerror = () => img.remove();
      el.appendChild(img);
      if (text) {
        const cap = document.createElement("b");
        cap.textContent = text;
        el.appendChild(cap);
      }
    } else {
      const b = document.createElement("b");
      b.textContent = text;
      el.appendChild(b);
    }
    if (sub) {
      const s = document.createElement("span");
      s.className = "url";
      s.textContent = sub;
      el.appendChild(s);
    }
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2700);
    sCatches.textContent = ++catches;
    statusEl.textContent = "caught: " + text;
  }

  // ---------- iframe access (same-origin via /proxy) ----------
  const pageDoc = () => { try { return frame.contentDocument; } catch { return null; } };
  const pageWin = () => { try { return frame.contentWindow; } catch { return null; } };

  // ---------- the spider ----------
  const LEGS = 8;
  const SCALE = 2;              // 2x bigger spider
  const spider = {
    x: innerWidth * 0.5, y: innerHeight * 0.5,
    dir: Math.random() * Math.PI * 2,
    speed: 1.6 * SCALE,
    legs: Array.from({ length: LEGS }, (_, i) => ({
      baseAngle: (i / LEGS) * Math.PI * 2 + Math.PI / LEGS,
      reach: (60 + Math.random() * 34) * SCALE,   // longer legs
      // three segments -> two joints (coxa->femur->tibia->tarsus)
      s1: 0, s2: 0, s3: 0,
      fx: 0, fy: 0,
      knee: { x: 0, y: 0 },
      ankle: { x: 0, y: 0 },
      stepping: false,
      stepT: 0,
      target: { x: 0, y: 0 },
      lastTouch: new Map(),
      touchEl: null,
    })),
  };
  for (const l of spider.legs) {
    const rest = l.reach * 0.95;
    l.s1 = rest * 0.38; l.s2 = rest * 0.34; l.s3 = rest * 0.28;
    l.fx = spider.x + Math.cos(l.baseAngle) * l.reach;
    l.fy = spider.y + Math.sin(l.baseAngle) * l.reach;
  }

  let totalDist = 0;

  // ---------- leg "touch" detection (tips & whole leg sweep the page) ----------
  // only links, images, and numbers are interesting to the spider
  const CATCH_SEL = "a[href], img";
  const MAX_CATCH_TEXT = 90;
  // regex to sniff numbers out of any element's text (prices, years, counts…)
  const NUM_RE = /(^|\s)[+~−-]?(\d{1,3}(?:[.,]\d{3})+|\d+)(?:[.,]\d+)?(%|\s?(?:kg|km|cm|mm|m|ft|mi|s|ms|h|Hz|kB|MB|GB|TB|bn|million|billion|trillion))?($|(?=\s|[.,;:!?)\]]))/;

  function isNumberish(el) {
    if (el.closest("a[href], img")) return false; // already a link/img
    // numbers are only worth catching if they're the focus: short standalone
    // text nodes like "2,749", "1997", "94%", "12.5 km"
    // textContent only (innerText would force layout on every probe)
    let t = "";
    for (const n of el.childNodes) {
      if (n.nodeType === 3) t += n.textContent;
    }
    t = t.trim();
    if (!t || t.length > 40) return false;
    return NUM_RE.test(t);
  }

  function isConsumed(el) {
    // consumed elements are blanked; skip them entirely — walk up the tree
    // since a consumed wrapper (e.g. a link around a hidden image) also kills
    // everything inside it
    for (let n = el; n && n !== el.ownerDocument.body; n = n.parentElement) {
      if (n.hasAttribute?.("data-consumed")) return true;
      // visibility:hidden elements (and anything inside them) are gone
      if (n.nodeType === 1 && getComputedStyle(n).visibility === "hidden") return true;
    }
    return false;
  }

  function probePoint(x, y) {
    const win = pageWin();
    if (!win) return null;
    try {
      let el = win.document.elementFromPoint(x, y);
      if (!el) return null;
      if (isConsumed(el)) return null;
      // links & images: match directly (skip ones the spider already ate)
      const target = el.closest(CATCH_SEL);
      if (target && !isConsumed(target)) return target;
      // numbers: climb a few ancestors, catching any small numeric text
      for (let n = el; n && n !== win.document.body; n = n.parentElement) {
        if (isNumberish(n) && !isConsumed(n)) return n;
      }
      return null;
    } catch { return null; }
  }

  // two-bone IK: joint between hip and end point, bending to `side`
  function ikJoint(hx, hy, tx, ty, l1, l2, side) {
    const dx = tx - hx, dy = ty - hy;
    const dRaw = Math.hypot(dx, dy) || 1;
    const d = Math.min(dRaw, l1 + l2 - 0.01);
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const px = hx + (dx / dRaw) * a;
    const py = hy + (dy / dRaw) * a;
    return { x: px + (-dy / dRaw) * h * side,
             y: py + ( dx / dRaw) * h * side };
  }

  function solveLeg(leg, side) {
    // joint 1 (knee): body -> knee spans s1, knee -> foot spans s2+s3
    const k = ikJoint(spider.x, spider.y, leg.fx, leg.fy, leg.s1, leg.s2 + leg.s3, side);
    leg.knee.x = k.x; leg.knee.y = k.y;
    // joint 2 (ankle): knee -> ankle spans s2, ankle -> foot spans s3
    const a = ikJoint(k.x, k.y, leg.fx, leg.fy, leg.s2, leg.s3, side);
    leg.ankle.x = a.x; leg.ankle.y = a.y;
  }

  function elementText(el) {
    if (el.tagName === "IMG") return (el.alt || el.src.split("/").pop() || "image").slice(0, MAX_CATCH_TEXT);
    // textContent (NOT innerText — innerText forces a full layout pass)
    const t = (el.textContent || el.value || "").trim().replace(/\s+/g, " ");
    return t.slice(0, MAX_CATCH_TEXT) || el.tagName.toLowerCase();
  }

  function updateSpider(dt) {
    // wander: slowly turn + occasional sudden turns (organic feel)
    spider.dir += (Math.random() - 0.5) * 0.08;
    if (Math.random() < 0.004) spider.dir += (Math.random() - 0.5) * 2;
    const burst = Math.random() < 0.02 ? 2.2 : 1;
    const sp = spider.speed * burst * (dt / 16.7);

    // steer back if wandering off-screen
    const margin = 120 * SCALE;
    if (spider.x < margin || spider.x > W - margin || spider.y < margin || spider.y > H - margin) {
      const toCenter = Math.atan2(H / 2 - spider.y, W / 2 - spider.x);
      let diff = toCenter - spider.dir;
      while (diff > Math.PI) diff -= 2 * Math.PI;
      while (diff < -Math.PI) diff += 2 * Math.PI;
      spider.dir += diff * 0.08;
    }
    spider.x += Math.cos(spider.dir) * sp;
    spider.y += Math.sin(spider.dir) * sp;
    totalDist += sp;
    sDist.textContent = Math.floor(totalDist);

    // legs: each leg steps when its foot lags too far behind, but never
    // simultaneously with an adjacent leg (natural alternating gait)
    for (let i = 0; i < LEGS; i++) {
      const leg = spider.legs[i];
      const idealAngle = leg.baseAngle + spider.dir;
      const ideal = {
        x: spider.x + Math.cos(idealAngle) * leg.reach,
        y: spider.y + Math.sin(idealAngle) * leg.reach,
      };
      const distFromIdeal = Math.hypot(ideal.x - leg.fx, ideal.y - leg.fy);

      if (!leg.stepping && distFromIdeal > leg.reach * 0.75) {
        // inhibit stepping if an adjacent leg is mid-step (prevents drag & sync issues)
        const prev = spider.legs[(i + LEGS - 1) % LEGS];
        const next = spider.legs[(i + 1) % LEGS];
        if (!prev.stepping && !next.stepping) {
          leg.stepping = true;
          leg.stepT = 0;
          // plant the foot ahead of the ideal spot in the direction of travel,
          // so it stays put longer before needing the next step
          leg.target = {
            x: ideal.x + Math.cos(spider.dir) * 18 * SCALE + (Math.random() - 0.5) * 8 * SCALE,
            y: ideal.y + Math.sin(spider.dir) * 18 * SCALE + (Math.random() - 0.5) * 8 * SCALE,
          };
        }
      }
      if (leg.stepping) {
        leg.stepT += dt / 110;   // quicker, snappier steps
        const k = Math.min(1, leg.stepT);
        const ease = k * (2 - k);
        leg.fx += (leg.target.x - leg.fx) * ease;
        leg.fy += (leg.target.y - leg.fy) * ease;
        // probe once mid-swing so a leg passing over a link interacts with it
        if (!leg.midProbed && k > 0.5) {
          leg.midProbed = true;
          probeLegTouch(leg);
        }
        if (k >= 1) {
          leg.stepping = false;
          leg.midProbed = false;
          onFootLand(leg);
        }
      }
    }
  }
  const now01 = () => performance.now() / 1000;

  // ---------- whole-leg "touch" detection (not just the tip) ----------
  function onFootLand(leg) { probeLegTouch(leg); }

  function legTouches(leg, side) {
    // 4 sample points (not 7) — enough coverage, 45% fewer hit-tests
    const pts = [
      [leg.knee.x, leg.knee.y],
      [(leg.knee.x + leg.ankle.x) / 2, (leg.knee.y + leg.ankle.y) / 2],
      [leg.ankle.x, leg.ankle.y],
      [leg.fx, leg.fy],
    ];
    for (const [x, y] of pts) {
      const el = probePoint(x, y);
      if (el) return el;
    }
    return null;
  }

  // global touch ledger: element key -> touch count (label pops every Nth touch)
  const touchCounts = new Map();

  function probeLegTouch(leg) {
    const side = leg.baseAngle < Math.PI ? 1 : -1;
    solveLeg(leg, side);
    const target = legTouches(leg, side);
    if (!target) { leg.touchEl = null; return; }
    leg.touchEl = target;

    const key = target.tagName + "|" + (target.textContent || "").slice(0, 60);
    const now = performance.now();
    // a single resting leg only counts the same element once per 1.5s,
    // so "touches" are distinct landings, not animation frames
    const legKey = leg.baseAngle.toFixed(2) + "@" + key;
    const legLast = leg.lastTouch.get(legKey) || 0;
    if (now - legLast < 1500) return;
    leg.lastTouch.set(legKey, now);

    const count = (touchCounts.get(key) || 0) + 1;
    touchCounts.set(key, count);

    const firstTouch = count === 1;
    // repeats need N touches before popping again; first contact is instant
    if (!firstTouch && count % LABEL_REUSE_COUNT !== 0) return;
    // global rate limit — but a brand-new element always gets through
    // (so a back leg landing on a link it never touched reacts immediately)
    if (!firstTouch && now - (probeLegTouch.lastLabel || 0) < 700) return;
    probeLegTouch.lastLabel = now;

    const win = pageWin();
    let text = elementText(target);
    let sub = null;
    let imgUrl = null;
    // image caught: pop the picture itself (directly, or wrapping an <a>, or a <picture>)
    let imgEl = null;
    if (target.tagName === "IMG") imgEl = target;
    else {
      imgEl = target.querySelector?.("img, picture img") || null;
      // an <a> wrapping an image should pop the image, not alt-text
      if (!imgEl && target.tagName === "A") {
        imgEl = target.querySelector("img");
      }
    }
    if (imgEl) {
      imgUrl = imgEl.currentSrc || imgEl.src;
      if (imgEl.tagName === "IMG") {
        const alt = (imgEl.alt || "").trim();
        if (alt) text = alt.slice(0, MAX_CATCH_TEXT);
      }
    }
    if (target.tagName === "A" && !imgEl) {
      try { sub = new URL(target.href, win.location.href).href; } catch {}
      if (sub && sub.length > 70) sub = sub.slice(0, 68) + "…";
    }

    // position the label ABOVE or BELOW the element's actual text box,
    // never in the middle of it — pick the side with more room
    let lx, ly;
    try {
      const r = target.getBoundingClientRect();
      const vw = win.innerWidth, vh = win.innerHeight;
      // convert iframe coords -> screen coords (iframe fills the viewport)
      const sx = r.left + r.width / 2;
      const spaceAbove = r.top, spaceBelow = vh - r.bottom;
      const below = spaceBelow >= spaceAbove;
      ly = below ? r.bottom + 14 : r.top - 14;
      // keep the label on-screen horizontally
      lx = Math.min(Math.max(sx, 160), vw - 160);
    } catch {
      lx = leg.fx; ly = leg.fy;
    }
    spawnLabel(lx, ly, text, sub, imgUrl);

    // the spider "consumes" links: erase the link text from the page
    // (image links lose their image instead). Marked data-consumed so
    // the spider stops interacting with it forever.
    try {
      if (imgEl) {
        imgEl.style.visibility = "hidden";   // blank the image, keep layout
        imgEl.setAttribute("data-consumed", "");
        // if the image sits inside a link, consume the whole link too,
        // otherwise the anchor keeps re-triggering the hidden image
        const wrapper = imgEl.closest("a[href]");
        if (wrapper && wrapper !== target) {
          wrapper.style.visibility = "hidden";
          wrapper.setAttribute("data-consumed", "");
        }
        if (target.tagName === "A") {
          target.style.visibility = "hidden";
          target.setAttribute("data-consumed", "");
        }
      } else if (target.tagName === "A") {
        target.style.color = "transparent";
        target.style.textDecoration = "none";
        target.style.border = "none";
        target.style.background = "none";
        target.style.textShadow = "none";
        target.style.pointerEvents = "none";   // no longer clickable either
        target.setAttribute("data-consumed", "");
        // blank underlines/pseudo-elements the CSS might add
        target.querySelectorAll("*").forEach(c => {
          c.style.color = "transparent";
          c.style.textShadow = "none";
          if (c.tagName === "IMG") { c.style.visibility = "hidden"; c.setAttribute("data-consumed", ""); }
        });
      }
    } catch {}
  }

  // ---------- drawing ----------
  function drawSpider() {
    ctx.clearRect(0, 0, W, H);

    // silk trail behind the body
    spider.trail = spider.trail || [];
    spider.trail.push({ x: spider.x, y: spider.y });
    if (spider.trail.length > 90) spider.trail.shift();
    ctx.beginPath();
    ctx.moveTo(spider.trail[0].x, spider.trail[0].y);
    for (const p of spider.trail) ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = "rgba(193,0,31,.20)";
    ctx.lineWidth = 1;
    ctx.shadowBlur = 6; ctx.shadowColor = "rgba(255,34,34,.55)";
    ctx.stroke();
    ctx.shadowBlur = 0;

    // legs (three segments: body -> knee -> ankle -> foot, solved by IK)
    ctx.lineCap = "round";
    for (const leg of spider.legs) {
      const side = leg.baseAngle < Math.PI ? 1 : -1;
      solveLeg(leg, side);

      ctx.beginPath();
      ctx.moveTo(spider.x, spider.y);
      ctx.lineTo(leg.knee.x, leg.knee.y);
      ctx.lineTo(leg.ankle.x, leg.ankle.y);
      ctx.lineTo(leg.fx, leg.fy);
      // solid black chitin, harsh and unlit
      ctx.strokeStyle = "#050505";
      ctx.lineWidth = 3.2 * SCALE;
      ctx.shadowBlur = leg.stepping ? 6 : 2;
      ctx.shadowColor = "rgba(193,0,31,.45)";
      ctx.stroke();

      // matte dark joints, barely visible — no gold
      ctx.beginPath(); ctx.arc(leg.knee.x, leg.knee.y, 2.4 * SCALE, 0, 7);
      ctx.fillStyle = "#0f0f0f";
      ctx.shadowBlur = 0;
      ctx.fill();
      ctx.beginPath(); ctx.arc(leg.ankle.x, leg.ankle.y, 1.9 * SCALE, 0, 7);
      ctx.fillStyle = "#0f0f0f";
      ctx.fill();

      // the only color on the leg: a sharp red tip, like a venomous point
      const tipR = leg.touchEl ? 4.4 * SCALE : (leg.stepping ? 3.2 : 2.6) * SCALE;
      ctx.beginPath();
      ctx.arc(leg.fx, leg.fy, tipR, 0, 7);
      ctx.fillStyle = "#e01515";
      ctx.shadowBlur = leg.touchEl ? 16 : 9;
      ctx.shadowColor = "#ff2222";
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.shadowBlur = 0;

    // body: matte-black cephalothorax + abdomen, rough and angular
    ctx.save();
    ctx.translate(spider.x, spider.y);
    ctx.rotate(spider.dir);
    // cephalothorax: hard-edged hexagonal plate instead of a soft ellipse
    ctx.beginPath();
    ctx.moveTo(10 * SCALE, 0);
    ctx.lineTo(6 * SCALE, -6.5 * SCALE);
    ctx.lineTo(-4 * SCALE, -7 * SCALE);
    ctx.lineTo(-8 * SCALE, -4 * SCALE);
    ctx.lineTo(-8 * SCALE, 4 * SCALE);
    ctx.lineTo(-4 * SCALE, 7 * SCALE);
    ctx.lineTo(6 * SCALE, 6.5 * SCALE);
    ctx.closePath();
    ctx.fillStyle = "#060606";
    ctx.shadowBlur = 6; ctx.shadowColor = "rgba(193,0,31,.5)";
    ctx.fill();
    ctx.shadowBlur = 0;
    // abdomen: jagged teardrop, not a smooth ellipse
    ctx.beginPath();
    ctx.moveTo(-6 * SCALE, -9 * SCALE);
    ctx.lineTo(-12 * SCALE, -6 * SCALE);
    ctx.lineTo(-22 * SCALE, -3 * SCALE);
    ctx.lineTo(-26 * SCALE, 0);
    ctx.lineTo(-22 * SCALE, 3 * SCALE);
    ctx.lineTo(-12 * SCALE, 6 * SCALE);
    ctx.lineTo(-6 * SCALE, 9 * SCALE);
    ctx.lineTo(-9 * SCALE, 0);
    ctx.closePath();
    const grad = ctx.createLinearGradient(-26 * SCALE, 0, -6 * SCALE, 0);
    grad.addColorStop(0, "#020202");
    grad.addColorStop(1, "#111111");
    ctx.fillStyle = grad;
    ctx.shadowBlur = 4; ctx.shadowColor = "rgba(0,0,0,.9)";
    ctx.fill();
    ctx.shadowBlur = 0;
    // faint red spine marks on the abdomen (rough, not decorative)
    ctx.strokeStyle = "rgba(193,0,31,.55)";
    ctx.lineWidth = 1.2 * SCALE;
    ctx.beginPath(); ctx.moveTo(-20 * SCALE, 0); ctx.lineTo(-14 * SCALE, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-23 * SCALE, -2.5 * SCALE); ctx.lineTo(-18 * SCALE, -2.5 * SCALE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-23 * SCALE, 2.5 * SCALE); ctx.lineTo(-18 * SCALE, 2.5 * SCALE); ctx.stroke();
    // small glaring red eyes, sunk into the plate
    ctx.fillStyle = "#d01414";
    ctx.shadowBlur = 7; ctx.shadowColor = "#ff2222";
    ctx.beginPath(); ctx.arc(8.5 * SCALE, -2.5 * SCALE, 1.5 * SCALE, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(8.5 * SCALE, 2.5 * SCALE, 1.5 * SCALE, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    // black fangs (chelicerae), tipped red
    ctx.strokeStyle = "#0a0a0a";
    ctx.lineWidth = 2.0 * SCALE;
    ctx.beginPath(); ctx.moveTo(9 * SCALE, -3 * SCALE); ctx.lineTo(13 * SCALE, -5.5 * SCALE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9 * SCALE, 3 * SCALE); ctx.lineTo(13 * SCALE, 5.5 * SCALE); ctx.stroke();
    ctx.fillStyle = "#e01515";
    ctx.beginPath(); ctx.arc(13 * SCALE, -5.5 * SCALE, 0.9 * SCALE, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(13 * SCALE, 5.5 * SCALE, 0.9 * SCALE, 0, 7); ctx.fill();
    ctx.restore();
  }

  let last = performance.now();
  let probeAcc = 0;
  let probeLeg = 0;
  function loop(now) {
    const dt = Math.min(34, now - last); last = now;   // don't teleport after a stall
    if (pageDoc()) {
      updateSpider(dt);
      // probe ONE leg per ~100ms round-robin (was: all 8 legs every 6 frames =
      // 56 cross-frame hit-tests in a burst, which tanked the framerate)
      probeAcc += dt;
      if (probeAcc > 100) {
        probeAcc = 0;
        const leg = spider.legs[probeLeg++ % LEGS];
        if (!leg.stepping) probeLegTouch(leg);
      }
      drawSpider();
    }
    else statusEl.textContent = "waiting for page to load…";
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---------- url bar ----------
  function go() {
    let u = urlInput.value.trim();
    if (!u) return;
    if (!u.startsWith("http")) u = "https://" + u;
    frame.src = "/proxy?url=" + encodeURIComponent(u);
    statusEl.textContent = "crawling " + u;
    spider.trail = [];
  }
  goBtn.addEventListener("click", go);
  urlInput.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  urlInput.value = new URL(frame.src, location.href).searchParams.get("url") || "";
})();
</script>
</body>
</html>
