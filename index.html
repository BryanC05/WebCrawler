<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>꒰⍉ ꒱ WebCrawler ꒰⍉ ꒱</title>
<style>
  :root {
    --red: #ff2222;
    --blood: #c1001f;
    --gold: #ffd700;
    --cyan: #00e5ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #060608; }
  body { font-family: "Courier New", monospace; color: var(--cyan); }

  /* the real webpage, full viewport */
  #page {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    border: 0;
    background: #fff;
  }

  /* spider canvas overlay */
  #web {
    position: fixed; inset: 0; z-index: 3;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* floating text labels */
  .catch {
    position: fixed; z-index: 5; pointer-events: none;
    font-family: "Courier New", monospace;
    font-size: 12px; line-height: 1.3;
    background: rgba(2, 6, 10, 0.88);
    padding: 6px 10px;
    border: 1px solid;
    border-radius: 3px;
    box-shadow: 0 0 10px currentColor;
    color: #dfe9ee;
    max-width: 280px;
    overflow-wrap: break-word;
    animation: pop 2.6s ease-out forwards;
  }
  .catch b { color: inherit; }
  .catch .url { opacity: .55; font-size: 10px; display: block; }
  @keyframes pop {
    0%   { transform: translate(-50%, -50%) scale(.4); opacity: 0; }
    12%  { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    20%  { transform: translate(-50%, -50%) scale(1); }
    70%  { opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1) translateY(-26px); opacity: 0; }
  }

  .hud {
    position: fixed; top: 16px; left: 20px; z-index: 10;
    font-size: 13px; letter-spacing: 1px;
    text-shadow: 0 0 8px var(--blood);
    user-select: none; pointer-events: none;
  }
  .hud .big {
    font-size: 22px; margin-bottom: 6px;
    text-shadow: 0 0 12px var(--red), 0 0 24px var(--gold);
    color: var(--gold);
  }
  .stats {
    position: fixed; top: 16px; right: 20px; z-index: 10;
    text-align: right; font-size: 13px; letter-spacing: 1px;
    text-shadow: 0 0 8px var(--cyan); pointer-events: none; user-select: none;
  }
  .stats span { color: var(--red); text-shadow: 0 0 8px var(--blood); }

  .urlbar {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    align-items: center;
  }
  .urlbar input {
    font-family: "Courier New", monospace; font-size: 13px;
    background: rgba(10,10,12,.9); color: var(--gold);
    border: 1px solid var(--blood); box-shadow: 0 0 8px rgba(193,0,31,.5);
    padding: 7px 12px; width: 380px; outline: none;
  }
  .urlbar button, .urlbar select {
    font-family: "Courier New", monospace; font-size: 13px;
    background: rgba(10,10,12,.9); color: var(--red);
    border: 1px solid var(--blood); box-shadow: 0 0 8px rgba(255,34,34,.5);
    padding: 7px 14px; cursor: pointer;
  }
  .urlbar select { color: var(--gold); }
  .urlbar label {
    font-size: 12px; color: var(--gold); text-shadow: 0 0 6px var(--blood);
    display: flex; align-items: center; gap: 6px;
    background: rgba(10,10,12,.9); border: 1px solid var(--blood);
    box-shadow: 0 0 8px rgba(193,0,31,.4); padding: 6px 10px;
    user-select: none;
  }
  .urlbar label input[type=checkbox] {
    width: 14px; height: 14px; accent-color: var(--red);
    cursor: pointer;
  }

  /* collected panel */
  #collected {
    position: fixed; top: 70px; left: 20px; z-index: 10;
    width: 320px; max-height: 40vh; overflow-y: auto;
    background: rgba(10,10,12,.85); border: 1px solid var(--blood);
    box-shadow: 0 0 12px rgba(193,0,31,.4); display: none;
  }
  #collected.visible { display: block; }
  #collected h3 {
    font-size: 12px; padding: 6px 10px; color: var(--gold);
    border-bottom: 1px solid rgba(193,0,31,.5);
  }
  #collected .item {
    padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,.05);
    font-size: 11px; color: #ddd;
  }
  #collected .item img { max-width: 60px; max-height: 40px; display: block; margin-bottom: 4px; }
  #collected .item a { color: var(--cyan); text-decoration: none; word-break: break-all; }
  #collected .toggle {
    position: fixed; top: 70px; left: 20px; z-index: 11;
    font-size: 11px; background: rgba(10,10,12,.9); color: var(--gold);
    border: 1px solid var(--blood); padding: 4px 8px; cursor: pointer;
  }

  /* loading indicator */
  #loading {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 20; display: none; color: var(--gold); text-shadow: 0 0 12px var(--red);
    font-size: 16px; letter-spacing: 2px;
  }
  #loading.visible { display: block; animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

  @media (max-width: 700px) {
    .urlbar input { width: 200px; }
    #collected { width: 90vw; left: 5vw; }
  }
</style>
</head>
<body>

<iframe id="page" src="/proxy?url=https%3A%2F%2Fen.wikipedia.org%2Fwiki%2FSpider"></iframe>
<canvas id="web"></canvas>

<div class="hud">
  <div class="big">꒰⍉ ꒱ WebCrawler</div>
  <div id="status">waking up the spider…</div>
</div>

<div class="stats">
  legs caught: <span id="sCatches">0</span><br>
  pixels walked: <span id="sDist">0</span>
</div>

<button class="toggle" id="colToggle">collected ▸</button>
<div id="collected"><h3>Collected</h3><div id="colList"></div></div>

<div id="loading">LOADING...</div>

<div class="urlbar">
  <input id="urlInput" type="text" placeholder="https://…">
  <button id="goBtn">crawl ▸</button>
  <select id="historySel"><option value="">history</option></select>
  <label><input type="checkbox" id="consumeToggle" checked> consume</label>
  <button id="clearBtn">clear</button>
  <button id="exportBtn">export</button>
</div>

<script>
(() => {
  const frame = document.getElementById("page");
  const canvas = document.getElementById("web");
  const ctx = canvas.getContext("2d");
  const statusEl = document.getElementById("status");
  const sCatches = document.getElementById("sCatches");
  const sDist = document.getElementById("sDist");
  const urlInput = document.getElementById("urlInput");
  const goBtn = document.getElementById("goBtn");
  const historySel = document.getElementById("historySel");
  const consumeToggle = document.getElementById("consumeToggle");
  const clearBtn = document.getElementById("clearBtn");
  const exportBtn = document.getElementById("exportBtn");
  const colToggle = document.getElementById("colToggle");
  const collected = document.getElementById("collected");
  const colList = document.getElementById("colList");
  const loading = document.getElementById("loading");

  // config
  const CFG = window.WCRAWLER_CFG || {consume:true};
  consumeToggle.checked = CFG.consume;

  let W, H;
  const resize = () => { W = canvas.width = innerWidth; H = canvas.height = innerHeight; };
  addEventListener("resize", resize); resize();

  // history
  const HISTORY_KEY = "wccrawler_history";
  function loadHistory(){
    try {
      const h = JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");
      historySel.innerHTML = '<option value="">history</option>';
      for (const u of h) {
        const o = document.createElement('option');
        o.value = u; o.textContent = u.length>60? u.slice(0,57)+'...': u;
        historySel.appendChild(o);
      }
    } catch(e){}
  }
  function saveHistory(u){
    try {
      let h = JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");
      h = [u, ...h.filter(x=>x!==u)].slice(0,20);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
      loadHistory();
    } catch(e){}
  }
  loadHistory();
  historySel.addEventListener('change', ()=>{
    if(historySel.value){ urlInput.value = historySel.value; go(); historySel.value=''; }
  });

  // collected items
  const collectedItems = [];
  function addCollected(item){
    collectedItems.unshift(item);
    const div = document.createElement('div');
    div.className = 'item';
    if(item.imgUrl){
      const img = document.createElement('img');
      img.src = item.imgUrl;
      div.appendChild(img);
    }
    const b = document.createElement('div');
    b.textContent = item.text;
    div.appendChild(b);
    if(item.sub){
      const a = document.createElement('a');
      a.href = item.sub; a.target = '_blank'; a.textContent = item.sub;
      div.appendChild(a);
    }
    colList.prepend(div);
  }
  colToggle.addEventListener('click', ()=>{
    collected.classList.toggle('visible');
    colToggle.textContent = collected.classList.contains('visible') ? 'collected ◂' : 'collected ▸';
  });

  // loading
  frame.addEventListener('load', ()=>{
    loading.classList.remove('visible');
    statusEl.textContent = 'spider active';
  });

  // ---------- floating text labels ----------
  const PALETTE = ["#ff2222", "#c1001f", "#ffd700", "#b8860b", "#ff4444", "#e6c200", "#00e5ff"];
  const LABEL_REUSE_COUNT = 3;
  let catches = 0;

  function spawnLabel(x, y, text, sub, imgUrl) {
    const el = document.createElement("div");
    el.className = "catch";
    const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.borderColor = color;
    el.style.color = color;
    if (imgUrl) {
      const img = document.createElement("img");
      img.src = imgUrl;
      img.style.display = "block";
      img.style.maxWidth = "200px";
      img.style.maxHeight = "150px";
      img.style.marginBottom = "4px";
      img.onerror = () => img.remove();
      el.appendChild(img);
      if (text) {
        const cap = document.createElement("b");
        cap.textContent = text;
        el.appendChild(cap);
      }
    } else {
      const b = document.createElement("b");
      b.textContent = text;
      el.appendChild(b);
    }
    if (sub) {
      const s = document.createElement("span");
      s.className = "url";
      s.textContent = sub;
      el.appendChild(s);
    }
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2700);
    sCatches.textContent = ++catches;
    statusEl.textContent = "caught: " + text;
    addCollected({text, sub, imgUrl});
  }

  // ---------- iframe access ----------
  const pageDoc = () => { try { return frame.contentDocument; } catch { return null; } };
  const pageWin = () => { try { return frame.contentWindow; } catch { return null; } };

  // ---------- spider ----------
  const LEGS = 8;
  const SCALE = 2;
  const spider = {
    x: innerWidth * 0.5, y: innerHeight * 0.5,
    dir: Math.random() * Math.PI * 2,
    speed: 1.6 * SCALE,
    legs: Array.from({ length: LEGS }, (_, i) => ({
      baseAngle: (i / LEGS) * Math.PI * 2 + Math.PI / LEGS,
      reach: (60 + Math.random() * 34) * SCALE,
      s1: 0, s2: 0, s3: 0,
      fx: 0, fy: 0,
      knee: { x: 0, y: 0 },
      ankle: { x: 0, y: 0 },
      stepping: false,
      stepT: 0,
      target: { x: 0, y: 0 },
      lastTouch: new Map(),
      touchEl: null,
    })),
  };
  for (const l of spider.legs) {
    const rest = l.reach * 0.95;
    l.s1 = rest * 0.38; l.s2 = rest * 0.34; l.s3 = rest * 0.28;
    l.fx = spider.x + Math.cos(l.baseAngle) * l.reach;
    l.fy = spider.y + Math.sin(l.baseAngle) * l.reach;
  }

  let totalDist = 0;

  // ---------- detection ----------
  const CATCH_SEL = "a[href], img";
  const MAX_CATCH_TEXT = 90;
  const NUM_RE = /(^|\s)[+~−-]?(\d{1,3}(?:[.,]\d{3})+|\d+)(?:[.,]\d+)?(%|\s?(?:kg|km|cm|mm|m|ft|mi|s|ms|h|Hz|kB|MB|GB|TB|bn|million|billion|trillion))?($|(?=\s|[.,;:!?)\]]))/;

  function isNumberish(el) {
    if (el.closest("a[href], img")) return false;
    let t = "";
    for (const n of el.childNodes) {
      if (n.nodeType === 3) t += n.textContent;
    }
    t = t.trim();
    if (!t || t.length > 40) return false;
    return NUM_RE.test(t);
  }

  function isConsumed(el) {
    for (let n = el; n && n !== el.ownerDocument?.body; n = n.parentElement) {
      if (n.hasAttribute?.("data-consumed")) return true;
      if (n.nodeType === 1) {
        try { if (getComputedStyle(n).visibility === "hidden") return true; } catch(e){}
      }
    }
    return false;
  }

  function probePoint(x, y) {
    const win = pageWin();
    if (!win) return null;
    try {
      let el = win.document.elementFromPoint(x, y);
      if (!el) return null;
      if (isConsumed(el)) return null;
      const target = el.closest(CATCH_SEL);
      if (target && !isConsumed(target)) return target;
      for (let n = el; n && n !== win.document.body; n = n.parentElement) {
        if (isNumberish(n) && !isConsumed(n)) return n;
      }
      return null;
    } catch { return null; }
  }

  function ikJoint(hx, hy, tx, ty, l1, l2, side) {
    const dx = tx - hx, dy = ty - hy;
    const dRaw = Math.hypot(dx, dy) || 1;
    const d = Math.min(dRaw, l1 + l2 - 0.01);
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const px = hx + (dx / dRaw) * a;
    const py = hy + (dy / dRaw) * a;
    return { x: px + (-dy / dRaw) * h * side,
             y: py + ( dx / dRaw) * h * side };
  }

  function solveLeg(leg, side) {
    const k = ikJoint(spider.x, spider.y, leg.fx, leg.fy, leg.s1, leg.s2 + leg.s3, side);
    leg.knee.x = k.x; leg.knee.y = k.y;
    const a = ikJoint(k.x, k.y, leg.fx, leg.fy, leg.s2, leg.s3, side);
    leg.ankle.x = a.x; leg.ankle.y = a.y;
  }

  function elementText(el) {
    if (el.tagName === "IMG") return (el.alt || (el.src||"").split("/").pop() || "image").slice(0, MAX_CATCH_TEXT);
    const t = (el.textContent || el.value || "").trim().replace(/\s+/g, " ");
    return t.slice(0, MAX_CATCH_TEXT) || el.tagName.toLowerCase();
  }

  function updateSpider(dt) {
    spider.dir += (Math.random() - 0.5) * 0.08;
    if (Math.random() < 0.004) spider.dir += (Math.random() - 0.5) * 2;
    const burst = Math.random() < 0.02 ? 2.2 : 1;
    const sp = spider.speed * burst * (dt / 16.7);

    const margin = 120 * SCALE;
    if (spider.x < margin || spider.x > W - margin || spider.y < margin || spider.y > H - margin) {
      const toCenter = Math.atan2(H / 2 - spider.y, W / 2 - spider.x);
      let diff = toCenter - spider.dir;
      while (diff > Math.PI) diff -= 2 * Math.PI;
      while (diff < -Math.PI) diff += 2 * Math.PI;
      spider.dir += diff * 0.08;
    }
    spider.x += Math.cos(spider.dir) * sp;
    spider.y += Math.sin(spider.dir) * sp;
    totalDist += sp;
    sDist.textContent = Math.floor(totalDist);

    for (let i = 0; i < LEGS; i++) {
      const leg = spider.legs[i];
      const idealAngle = leg.baseAngle + spider.dir;
      const ideal = {
        x: spider.x + Math.cos(idealAngle) * leg.reach,
        y: spider.y + Math.sin(idealAngle) * leg.reach,
      };
      const distFromIdeal = Math.hypot(ideal.x - leg.fx, ideal.y - leg.fy);

      if (!leg.stepping && distFromIdeal > leg.reach * 0.75) {
        const prev = spider.legs[(i + LEGS - 1) % LEGS];
        const next = spider.legs[(i + 1) % LEGS];
        if (!prev.stepping && !next.stepping) {
          leg.stepping = true;
          leg.stepT = 0;
          leg.target = {
            x: ideal.x + Math.cos(spider.dir) * 18 * SCALE + (Math.random() - 0.5) * 8 * SCALE,
            y: ideal.y + Math.sin(spider.dir) * 18 * SCALE + (Math.random() - 0.5) * 8 * SCALE,
          };
        }
      }
      if (leg.stepping) {
        leg.stepT += dt / 110;
        const k = Math.min(1, leg.stepT);
        const ease = k * (2 - k);
        leg.fx += (leg.target.x - leg.fx) * ease;
        leg.fy += (leg.target.y - leg.fy) * ease;
        if (!leg.midProbed && k > 0.5) {
          leg.midProbed = true;
          probeLegTouch(leg);
        }
        if (k >= 1) {
          leg.stepping = false;
          leg.midProbed = false;
          onFootLand(leg);
        }
      }
    }
  }

  function onFootLand(leg) { probeLegTouch(leg); }

  function legTouches(leg, side) {
    const pts = [
      [leg.knee.x, leg.knee.y],
      [(leg.knee.x + leg.ankle.x) / 2, (leg.knee.y + leg.ankle.y) / 2],
      [leg.ankle.x, leg.ankle.y],
      [leg.fx, leg.fy],
    ];
    for (const [x, y] of pts) {
      const el = probePoint(x, y);
      if (el) return el;
    }
    return null;
  }

  const touchCounts = new Map();

  function probeLegTouch(leg) {
    const side = leg.baseAngle < Math.PI ? 1 : -1;
    solveLeg(leg, side);
    const target = legTouches(leg, side);
    if (!target) { leg.touchEl = null; return; }
    leg.touchEl = target;

    const key = target.tagName + "|" + (target.textContent || "").slice(0, 60);
    const now = performance.now();
    const legKey = leg.baseAngle.toFixed(2) + "@" + key;
    const legLast = leg.lastTouch.get(legKey) || 0;
    if (now - legLast < 1500) return;
    leg.lastTouch.set(legKey, now);

    const count = (touchCounts.get(key) || 0) + 1;
    touchCounts.set(key, count);

    const firstTouch = count === 1;
    if (!firstTouch && count % LABEL_REUSE_COUNT !== 0) return;
    if (!firstTouch && now - (probeLegTouch.lastLabel || 0) < 700) return;
    probeLegTouch.lastLabel = now;

    const win = pageWin();
    let text = elementText(target);
    let sub = null;
    let imgUrl = null;
    let imgEl = null;
    if (target.tagName === "IMG") imgEl = target;
    else {
      imgEl = target.querySelector?.("img, picture img") || null;
      if (!imgEl && target.tagName === "A") {
        imgEl = target.querySelector("img");
      }
    }
    if (imgEl) {
      imgUrl = imgEl.currentSrc || imgEl.src;
      if (imgEl.tagName === "IMG") {
        const alt = (imgEl.alt || "").trim();
        if (alt) text = alt.slice(0, MAX_CATCH_TEXT);
      }
    }
    if (target.tagName === "A" && !imgEl) {
      try { sub = new URL(target.href, win.location.href).href; } catch {}
      if (sub && sub.length > 70) sub = sub.slice(0, 68) + "…";
    }

    let lx, ly;
    try {
      const r = target.getBoundingClientRect();
      const vw = win.innerWidth, vh = win.innerHeight;
      const sx = r.left + r.width / 2;
      const spaceAbove = r.top, spaceBelow = vh - r.bottom;
      const below = spaceBelow >= spaceAbove;
      ly = below ? r.bottom + 14 : r.top - 14;
      lx = Math.min(Math.max(sx, 160), vw - 160);
    } catch {
      lx = leg.fx; ly = leg.fy;
    }
    spawnLabel(lx, ly, text, sub, imgUrl);

    if (!consumeToggle.checked) return;
    try {
      if (imgEl) {
        imgEl.style.visibility = "hidden";
        imgEl.setAttribute("data-consumed", "");
        const wrapper = imgEl.closest("a[href]");
        if (wrapper && wrapper !== target) {
          wrapper.style.visibility = "hidden";
          wrapper.setAttribute("data-consumed", "");
        }
        if (target.tagName === "A") {
          target.style.visibility = "hidden";
          target.setAttribute("data-consumed", "");
        }
      } else if (target.tagName === "A") {
        target.style.color = "transparent";
        target.style.textDecoration = "none";
        target.style.border = "none";
        target.style.background = "none";
        target.style.textShadow = "none";
        target.style.pointerEvents = "none";
        target.setAttribute("data-consumed", "");
        target.querySelectorAll("*").forEach(c => {
          c.style.color = "transparent";
          c.style.textShadow = "none";
          if (c.tagName === "IMG") { c.style.visibility = "hidden"; c.setAttribute("data-consumed", ""); }
        });
      }
    } catch {}
  }

  // ---------- drawing ----------
  function drawSpider() {
    ctx.clearRect(0, 0, W, H);
    spider.trail = [];
    // legs
    ctx.lineCap = "round";
    for (const leg of spider.legs) {
      const side = leg.baseAngle < Math.PI ? 1 : -1;
      solveLeg(leg, side);
      ctx.beginPath();
      ctx.moveTo(spider.x, spider.y);
      ctx.lineTo(leg.knee.x, leg.knee.y);
      ctx.lineTo(leg.ankle.x, leg.ankle.y);
      ctx.lineTo(leg.fx, leg.fy);
      ctx.strokeStyle = "#050505";
      ctx.lineWidth = 3.2 * SCALE;
      ctx.shadowBlur = leg.stepping ? 6 : 2;
      ctx.shadowColor = "rgba(193,0,31,.45)";
      ctx.stroke();
      ctx.beginPath(); ctx.arc(leg.knee.x, leg.knee.y, 2.4 * SCALE, 0, 7); ctx.fillStyle = "#0f0f0f"; ctx.shadowBlur=0; ctx.fill();
      ctx.beginPath(); ctx.arc(leg.ankle.x, leg.ankle.y, 1.9 * SCALE, 0, 7); ctx.fillStyle = "#0f0f0f"; ctx.fill();
      const tipR = leg.touchEl ? 4.4 * SCALE : (leg.stepping ? 3.2 : 2.6) * SCALE;
      ctx.beginPath(); ctx.arc(leg.fx, leg.fy, tipR, 0, 7); ctx.fillStyle = "#e01515"; ctx.shadowBlur = leg.touchEl ? 16 : 9; ctx.shadowColor = "#ff2222"; ctx.fill(); ctx.shadowBlur=0;
    }
    ctx.save();
    ctx.translate(spider.x, spider.y);
    ctx.rotate(spider.dir);
    ctx.beginPath();
    ctx.moveTo(10*SCALE,0); ctx.lineTo(6*SCALE,-6.5*SCALE); ctx.lineTo(-4*SCALE,-7*SCALE); ctx.lineTo(-8*SCALE,-4*SCALE); ctx.lineTo(-8*SCALE,4*SCALE); ctx.lineTo(-4*SCALE,7*SCALE); ctx.lineTo(6*SCALE,6.5*SCALE); ctx.closePath();
    ctx.fillStyle="#060606"; ctx.shadowBlur=6; ctx.shadowColor="rgba(193,0,31,.5)"; ctx.fill(); ctx.shadowBlur=0;
    ctx.beginPath();
    ctx.moveTo(-6*SCALE,-9*SCALE); ctx.lineTo(-12*SCALE,-6*SCALE); ctx.lineTo(-22*SCALE,-3*SCALE); ctx.lineTo(-26*SCALE,0); ctx.lineTo(-22*SCALE,3*SCALE); ctx.lineTo(-12*SCALE,6*SCALE); ctx.lineTo(-6*SCALE,9*SCALE); ctx.lineTo(-9*SCALE,0); ctx.closePath();
    const grad=ctx.createLinearGradient(-26*SCALE,0,-6*SCALE,0); grad.addColorStop(0,'#020202'); grad.addColorStop(1,'#111111'); ctx.fillStyle=grad; ctx.shadowBlur=4; ctx.shadowColor="rgba(0,0,0,.9)"; ctx.fill(); ctx.shadowBlur=0;
    ctx.strokeStyle="rgba(193,0,31,.55)"; ctx.lineWidth=1.2*SCALE;
    ctx.beginPath(); ctx.moveTo(-20*SCALE,0); ctx.lineTo(-14*SCALE,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-23*SCALE,-2.5*SCALE); ctx.lineTo(-18*SCALE,-2.5*SCALE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-23*SCALE,2.5*SCALE); ctx.lineTo(-18*SCALE,2.5*SCALE); ctx.stroke();
    ctx.fillStyle="#d01414"; ctx.shadowBlur=7; ctx.shadowColor="#ff2222";
    ctx.beginPath(); ctx.arc(8.5*SCALE,-2.5*SCALE,1.5*SCALE,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(8.5*SCALE,2.5*SCALE,1.5*SCALE,0,7); ctx.fill(); ctx.shadowBlur=0;
    ctx.strokeStyle="#0a0a0a"; ctx.lineWidth=2.0*SCALE;
    ctx.beginPath(); ctx.moveTo(9*SCALE,-3*SCALE); ctx.lineTo(13*SCALE,-5.5*SCALE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9*SCALE,3*SCALE); ctx.lineTo(13*SCALE,5.5*SCALE); ctx.stroke();
    ctx.fillStyle="#e01515";
    ctx.beginPath(); ctx.arc(13*SCALE,-5.5*SCALE,0.9*SCALE,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(13*SCALE,5.5*SCALE,0.9*SCALE,0,7); ctx.fill();
    ctx.restore();
  }

  let last = performance.now();
  let probeAcc = 0;
  let probeLeg = 0;
  function loop(now){
    const dt = Math.min(34, now - last); last = now;
    if (pageDoc()) {
      updateSpider(dt);
      probeAcc += dt;
      if (probeAcc > 100) {
        probeAcc = 0;
        const leg = spider.legs[probeLeg++ % LEGS];
        if (!leg.stepping) probeLegTouch(leg);
      }
      drawSpider();
    }
    else statusEl.textContent = "waiting for page to load…";
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---------- url bar ----------
  function go() {
    let u = urlInput.value.trim();
    if (!u) return;
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    loading.classList.add('visible');
    statusEl.textContent = "crawling " + u;
    frame.src = "/proxy?url=" + encodeURIComponent(u);
    spider.trail = [];
    saveHistory(u);
    // reset consumed visuals on new page? keep state but page is new iframe
  }
  goBtn.addEventListener("click", go);
  urlInput.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  try {
    urlInput.value = new URL(frame.src, location.href).searchParams.get("url") || "";
  } catch(e){}

  clearBtn.addEventListener('click', ()=>{
    catches = 0; sCatches.textContent = '0';
    touchCounts.clear();
    for (const l of spider.legs){ l.lastTouch.clear(); }
    statusEl.textContent = 'cleared caught memory';
  });

  exportBtn.addEventListener('click', async ()=>{
    try {
      // export current canvas state as png
      const data = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = data;
      a.download = 'webcrawler-snapshot.png';
      a.click();
    } catch(e){
      statusEl.textContent = 'export failed';
    }
  });
})();
</script>
</body>
</html>
